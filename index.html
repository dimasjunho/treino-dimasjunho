async function analisarTreino(){
  if(!S.ak){alert("Configure sua chave de API na aba CONFIG.");return;}
  var pl=PL[S.w-1];var isSC=SD2[S.w]===1;
  var ten=S.dia==="1"?"Boston 13":(isSC?"NB FuelCell SC Trainer V3":"Glycerin Max");
  var di=S.dia==="1"?pl.d1:pl.d2;
  var day=S.dia==="1"?(S.tv?"Quarta (Catole do Rocha)":"Terca (Joao Pessoa)"):(S.tv?"Domingo (Joao Pessoa)":"Sexta (Joao Pessoa)");
  S.loading=true;S.rel=null;render();
  try{
    var cnt=[];
    S.imgs.forEach(function(img){
      var p=img.split(",");
      cnt.push({type:"image",source:{type:"base64",media_type:p[0].match(/data:(.*);/)[1],data:p[1]}});
    });
    cnt.push({type:"text",text:"Analise o treino do Dimas e escreva um RELATORIO COMPLETO em texto corrido, didatico e facil de entender. NÃO use JSON. Use o seguinte formato:\n\n---RESUMO---\n(2-3 frases resumindo o treino)\n\n---METRICAS---\n(liste cada metrica no formato: Nome: valor - avaliacao em palavras simples. Ex: Pace medio: 6:15/km - Excelente, dentro do alvo)\n\n---CANELAS---\n(status das canelas e se precisa de gelo)\n\n---PONTOS POSITIVOS---\n(liste os pontos positivos com marcador +)\n\n---PONTOS DE ATENCAO---\n(liste pontos de atencao com marcador !)\n\n---ANALISE DETALHADA---\n(analise completa e didatica: explique o que cada metrica significa para o Dimas, como o calor de Joao Pessoa afetou o treino, comparacao com treinos anteriores se possivel, biomecânica em termos simples)\n\n---PROXIMO TREINO---\n(orientacao clara e completa para o proximo treino: qual dia, qual tenis, distancia, pace, gelo, alongamentos)\n\nDados do treino:\nSemana "+S.w+" | Dia "+S.dia+" | "+new Date().toLocaleDateString("pt-BR")+"\nDia: "+day+"\nTreino prescrito: "+di.t+" - Pace alvo: "+di.p+"\nTenis: "+ten+"\nDistancia: "+(S.dist||"nao informada")+"km\nObs do Dimas: "+(S.notas||"nenhuma")});
    var resp=await fetch(PROXY,{
      method:"POST",
      headers:{"Content-Type":"application/json","x-api-key":S.ak,"anthropic-version":"2023-06-01"},
      body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:4000,system:SYS,messages:[{role:"user",content:cnt}]})
    });
    var data=await resp.json();
    if(data.error)throw new Error(data.error.message);
    var texto=data.content[0].text;
    // parsear as secoes do texto
    function extrairSecao(txt,secao){
      var ini=txt.indexOf("---"+secao+"---");
      if(ini<0)return "";
      ini+=("---"+secao+"---").length;
      var prox=txt.indexOf("---",ini);
      return (prox>=0?txt.substring(ini,prox):txt.substring(ini)).trim();
    }
    var canelaTxt=extrairSecao(texto,"CANELAS").toLowerCase();
    var canStatus="sem_dor";
    if(canelaTxt.indexOf("dor")>=0&&canelaTxt.indexOf("sem dor")<0)canStatus="leve_desconforto";
    if(canelaTxt.indexOf("muita dor")>=0||canelaTxt.indexOf("dor intensa")>=0)canStatus="dor";
    var precisaGelo=canelaTxt.indexOf("gelo")>=0;
    S.rel={
      resumo:extrairSecao(texto,"RESUMO"),
      metricas:extrairSecao(texto,"METRICAS"),
      canelas:canStatus,
      gelo:precisaGelo,
      positivos:extrairSecao(texto,"PONTOS POSITIVOS"),
      atencao:extrairSecao(texto,"PONTOS DE ATENCAO"),
      analise:extrairSecao(texto,"ANALISE DETALHADA"),
      proximo:extrairSecao(texto,"PROXIMO TREINO"),
      textoCompleto:texto
    };
  }catch(err){
    S.rel={resumo:"Erro ao analisar: "+err.message,metricas:"",canelas:"sem_dor",gelo:false,positivos:"",atencao:"",analise:"Verifique sua conexao e tente novamente.",proximo:"",textoCompleto:""};
  }
  S.loading=false;render();
}

function salvarTreino(){
  var isSC=SD2[S.w]===1;
  var sk=S.dia==="1"?"boston13":(isSC?"scTrainer":"glycerinMax");
  var wo={w:S.w,d:S.dia,sk:sk,km:parseFloat(S.dist)||0,dt:new Date().toLocaleDateString("pt-BR"),can:S.rel?S.rel.canelas:"sem_dor",res:S.rel?S.rel.resumo.substring(0,200):"Treino registrado.",rel:S.rel?JSON.parse(JSON.stringify(S.rel)):null};
  S.tr.unshift(wo);lset("tr",S.tr);
  var k=Object.assign({},S.km);if(sk&&wo.km>0)k[sk]=(k[sk]||0)+wo.km;
  S.km=k;lset("km",k);
  S.imgs=[];S.notas="";S.dist="";S.rel=null;
  bkpAuto();
  alert("Treino salvo! Backup gerado automaticamente.");
  setTab("hist");
}

function bkpAuto(){
  try{
    var d={w:S.w,tv:S.tv,tr:S.tr,km:S.km,dt:new Date().toLocaleDateString("pt-BR")};
    var blob=new Blob([JSON.stringify(d,null,2)],{type:"application/json"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");
    a.href=url;
    a.download="backup_treino_"+new Date().toLocaleDateString("pt-BR").replace(/\//g,"-")+".json";
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }catch(e){}
}

function bkpManual(){bkpAuto();alert("Backup salvo! Guarde no Google Drive ou WhatsApp.");}

function restaurarBackup(inp){
  var file=inp.files[0];if(!file)return;
  var r=new FileReader();
  r.onload=function(e){
    try{
      var d=JSON.parse(e.target.result);
      if(d.tr!==undefined){
        S.w=d.w||1;S.tv=d.tv||false;S.tr=d.tr||[];
        S.km=Object.assign({boston13:0,glycerinMax:0,nimbus26:0,scTrainer:0},d.km||{});
        lset("w",S.w);lset("tv",S.tv?"1":"0");lset("tr",S.tr);lset("km",S.km);
        alert("Restaurado com sucesso! "+S.tr.length+" treino(s) recuperado(s).");render();
      }else{alert("Arquivo invalido.");}
    }catch(err){alert("Erro ao restaurar: "+err.message);}
  };
  r.readAsText(file);
}

async function enviarChat(){
  var ta=document.getElementById("ci-ta");
  var txt=ta?ta.value.trim():S.cinp.trim();
  if(!txt&&!S.cimgs.length)return;
  if(!S.ak){alert("Configure sua chave de API na aba CONFIG.");return;}
  S.cload=true;
  var cnt=[];
  S.cimgs.forEach(function(img){var p=img.split(",");cnt.push({type:"image",source:{type:"base64",media_type:p[0].match(/data:(.*);/)[1],data:p[1]}});});
  if(txt)cnt.push({type:"text",text:txt});
  S.chat.push({role:"user",content:cnt,text:txt,ni:S.cimgs.length});
  S.cinp="";S.cimgs=[];
  lset("ch",S.chat.slice(-60));render();
  setTimeout(function(){var cm=document.getElementById("cmsg");if(cm)cm.scrollTop=cm.scrollHeight;},50);
  try{
    var msgs=S.chat.map(function(m){return{role:m.role,content:m.content||[{type:"text",text:m.text||""}]};});
    var resp=await fetch(PROXY,{
      method:"POST",
      headers:{"Content-Type":"application/json","x-api-key":S.ak,"anthropic-version":"2023-06-01"},
      body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1500,system:SYS,messages:msgs})
    });
    var data=await resp.json();
    if(data.error)throw new Error(data.error.message);
    var rtxt=data.content.filter(function(c){return c.type==="text";}).map(function(c){return c.text;}).join("\n");
    S.chat.push({role:"assistant",content:[{type:"text",text:rtxt}],text:rtxt});
    lset("ch",S.chat.slice(-60));
  }catch(err){
    S.chat.push({role:"assistant",content:[{type:"text",text:"Erro: "+err.message}],text:"Erro: "+err.message});
  }
  S.cload=false;render();
  setTimeout(function(){var cm=document.getElementById("cmsg");if(cm)cm.scrollTop=cm.scrollHeight;},80);
}

    "<button class='btn bfoto' onclick='document.getElementById(\"fi\").click()'><span style='font-size:20px'>FOTO</span><span style='font-size:13px'>Adicionar prints do Samsung Health</span></button>"+
    "<input type='file' id='fi' accept='image/*' multiple style='display:none' onchange='addI(this)'>"+
    (S.imgs.length?"<div class='imgs'>"+S.imgs.map(function(_,i){return "<div class='imgt'><img id='im"+i+"'><button class='imgd' onclick='rmImg("+i+")'>X</button></div>";}).join("")+"</div>":"")+
    "<input type='number' id='idist' placeholder='Distancia em km' value='"+S.dist+"' oninput='S.dist=this.value' step='0.1'>"+
    "<textarea id='inotas' rows='3' placeholder='Como foi o treino? Dores, canelas, sensacoes...' oninput='S.notas=this.value'>"+S.notas+"</textarea>"+
    "<button class='btn baz' onclick='analisarTreino()' "+(podeAn?"":"disabled style='opacity:0.4'")+">"+(S.loading?"Analisando...":"ANALISAR COM CLAUDE")+"</button>"+
    "<button class='btn bvd' onclick='salvarTreino()' style='opacity:0.7'>SALVAR SEM ANALISE</button>"+
    relH;
    setTimeout(function(){S.imgs.forEach(function(_,i){var el=document.getElementById("im"+i);if(el)el.src=S.imgs[i];});},50);
  }

  else if(S.tab==="hist"){
    var cTag={sem_dor:"tok",leve_desconforto:"twn",dor:"ter"};
    var cLab={sem_dor:"Canelas ok",leve_desconforto:"Leve desconforto",dor:"Com dor"};
    H+="<p class='h2'>Historico</p>";
    if(!S.tr.length){
      H+="<div class='vazio'><p class='vt'>Nenhum treino salvo ainda</p><p class='vs'>Va em REGISTRO para adicionar!</p></div>";
    }else{
      H+=S.tr.map(function(wo,i){
        return "<div class='hcard'>"+
          "<div class='hrow'><div style='flex:1'><p class='htit'>Sem "+wo.w+" - Dia "+wo.d+"</p>"+
          "<p class='hsub'>"+wo.dt+(wo.km>0?" | "+wo.km+"km":"")+(wo.sk?" | "+SNM[wo.sk]:"")+"</p></div>"+
          "<span class='tag "+(cTag[wo.can]||"tok")+"'>"+(cLab[wo.can]||"ok")+"</span></div>"+
          "<p class='hres'>"+wo.res+"</p>"+
          (wo.rel?"<p style='font-size:12px;color:#00e676;margin-bottom:10px;font-weight:700'>Com analise completa do Claude</p>":"<p style='font-size:12px;color:#546e7a;margin-bottom:10px;font-weight:700'>Registrado sem analise</p>")+
          "<button class='btn baz' onclick='gerarPDF("+i+")'>BAIXAR RELATORIO</button>"+
        "</div>";
      }).join("");
    }
  }

  else if(S.tab==="shoes"){
    H+="<p class='h2'>Controle de Tenis</p>"+
    TEN.map(function(t){
      var km=Math.round(S.km[t.key]||0);var pct=Math.min(100,Math.round((km/t.max)*100));
      return "<div class='tcard "+t.cl+"'><div class='trow'><div style='flex:1'><p class='tnm'>"+t.n+"</p><p class='tmr'>"+t.m+"</p></div><p class='tkm'>"+km+" / "+t.max+" km</p></div><div class='bar'><div class='barf' style='width:"+pct+"%'></div></div><div class='bari'><span>"+pct+"% da vida util</span><span>~"+(t.max-km)+" km rest.</span></div></div>";
    }).join("")+
    "<p style='font-size:13px;color:#546e7a;text-align:center;margin-top:6px;font-weight:700'>Km acumulados ao salvar treinos</p>";
  }

  else if(S.tab==="bkp"){
    H+="<p class='h2'>Backup dos Dados</p>"+
    "<div class='cav'><p style='font-size:14px;font-weight:700;color:#90caf9;line-height:1.6'>Backup automatico gerado a cada treino salvo. Guarde o arquivo .json no Google Drive ou WhatsApp para nao perder seus dados.</p></div>"+
    "<div class='cinf'><p class='tnome'>Dados atuais</p><p class='tip'>"+S.tr.length+" treino(s) registrado(s)</p></div>"+
    "<button class='btn baz' onclick='bkpManual()'>FAZER BACKUP AGORA</button>"+
    "<div class='divl'></div>"+
    "<p style='font-size:17px;font-weight:900;color:#fff;margin-bottom:12px'>Restaurar backup</p>"+
    "<div class='cal'><p style='font-size:14px;font-weight:700;color:#ffcc80;line-height:1.6'>Atencao: restaurar substitui todos os dados atuais do app!</p></div>"+
    "<button class='btn bam' onclick='abrirRestaurar()'>SELECIONAR ARQUIVO DE BACKUP</button>"+
    "<input type='file' id='finp-bk' accept='.json' style='display:none' onchange='restaurarBackup(this)'>";
  }

  else if(S.tab==="cfg"){
    H+="<p class='h2'>Configuracoes</p>"+
    "<div class='cbk'><p style='font-size:16px;font-weight:900;color:#fff;margin-bottom:6px'>Chave de API Anthropic</p>"+
    "<p style='font-size:13px;color:#90a4ae;margin-bottom:10px;line-height:1.6'>Necessaria para analise de treino e chat. Obtenha gratuitamente em console.anthropic.com</p>"+
    (S.ak?"<p style='font-size:14px;color:#00e676;margin-bottom:10px;font-weight:700'>Chave configurada</p>":"<p style='font-size:14px;color:#ff9800;margin-bottom:10px;font-weight:700'>Chave nao configurada</p>")+
    "<input type='password' id='inp-ak' placeholder='sk-ant-...' value='"+S.ak+"'>"+
    "<button class='btn bvd' onclick='salvarChave()'>SALVAR CHAVE</button></div>"+
    "<div class='cbk'><p style='font-size:16px;font-weight:900;color:#fff;margin-bottom:6px'>Historico do Chat</p>"+
    "<p style='font-size:13px;color:#90a4ae;margin-bottom:10px'>"+S.chat.length+" mensagem(ns) salva(s)</p>"+
    "<button class='btn brx' onclick='limparChat()'>LIMPAR HISTORICO DO CHAT</button></div>";
  }

  H+="</div></div>";
  cnt.innerHTML=H;
}

load();render();
</script>
</body>
</html>
