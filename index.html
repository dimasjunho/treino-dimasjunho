];

  {key:"scTrainer",n:"SC Trainer V3",m:"New Balance",max:500,cl:"tc-g"},
];
const SNM={boston13:"Boston 13",glycerinMax:"Glycerin Max",nimbus26:"Nimbus 26",scTrainer:"SC Trainer V3"};

let S={tab:"home",w:1,tv:false,tr:[],km:{boston13:0,glycerinMax:0,nimbus26:0,scTrainer:0},dia:"1",imgs:[],notas:"",dist:"",ck:{}};

function load(){
  try{S.w=parseInt(localStorage.getItem("w"))||1;}catch(e){}
  try{S.tv=localStorage.getItem("tv")==="1";}catch(e){}
  try{S.tr=JSON.parse(localStorage.getItem("tr")||"[]");}catch(e){}
  try{S.km=Object.assign({boston13:0,glycerinMax:0,nimbus26:0,scTrainer:0},JSON.parse(localStorage.getItem("km")||"{}"));}catch(e){}
}
function sv(k,v){try{localStorage.setItem(k,typeof v==="string"?v:JSON.stringify(v));}catch(e){}}
function setTab(t){S.tab=t;render();}
function chSem(d){const n=S.w+d;if(n<1||n>16)return;S.w=n;sv("w",n);render();}
function togVi(){S.tv=!S.tv;sv("tv",S.tv?"1":"0");render();}
function togCk(id){S.ck[id]=!S.ck[id];render();}
function setDia(d){S.dia=d;render();}
function addI(inp){Array.from(inp.files).forEach(f=>{const r=new FileReader();r.onload=e=>{S.imgs.push(e.target.result);render();};r.readAsDataURL(f);});}
function rmImg(i){S.imgs.splice(i,1);render();}

function analisar(){
  const pl=PL[S.w-1];const isSC=SD2[S.w]===1;
  const ten=S.dia==="1"?"Boston 13":(isSC?"NB FuelCell SC Trainer V3":"Glycerin Max");
  const di=S.dia==="1"?pl.d1:pl.d2;

  alert(msg);

function salvarTreino(){
  const isSC=SD2[S.w]===1;const sk=S.dia==="1"?"boston13":(isSC?"scTrainer":"glycerinMax");

  S.tr.unshift(wo);sv("tr",S.tr);
  const k=Object.assign({},S.km);if(sk&&wo.km>0)k[sk]=(k[sk]||0)+wo.km;S.km=k;sv("km",k);
  S.imgs=[];S.notas="";S.dist="";
  alert("Treino salvo com sucesso!");setTab("hist");
}

  w.document.close();
}

    const di=S.dia==="1"?pl.d1:pl.d2;
    const tenLabel=S.dia==="1"?"Boston 13 (Adidas)":(isSC?"SC Trainer V3 (New Balance)":"Glycerin Max (Brooks)");
    const podeEnv=S.notas.trim().length>0||S.imgs.length>0;
    H="<div class='pg'><p class='h2'>Registrar treino</p>"+
    "<div class='card-aviso'><p style='font-size:28px;font-weight:700;color:#90caf9;line-height:1.6'>Preencha os dados e clique em ANALISAR. Abra o Claude em outra aba e cole as informacoes para obter o relatorio!</p></div>"+
    "<div class='dsels'>"+
      "<button class='dsel "+(S.dia==="1"?"on-r":"")+"' onclick=\"setDia('1')\"><span class='dn'>DIA 1</span><span class='dd'>"+(S.tv?"Quarta":"Terca")+"</span></button>"+
      "<button class='dsel "+(S.dia==="2"?"on-b":"")+"' onclick=\"setDia('2')\"><span class='dn'>DIA 2</span><span class='dd'>"+(S.tv?"Domingo":"Sexta")+"</span></button>"+
    "</div>"+
    "<div class='card-info'><p class='ten-nome'>"+tenLabel+"</p><p class='tip'>"+di.t+" | Pace: "+di.p+"</p></div>"+
    "<button class='btn btn-foto' onclick=\"document.getElementById('fi').click()\"><span style='font-size:42px'>FOTO</span><span style='font-size:26px'>Adicionar prints do Samsung Health</span></button>"+
    "<input type='file' id='fi' accept='image/*' multiple style='display:none' onchange='addI(this)'>"+
    (S.imgs.length?"<div class='imgs'>"+S.imgs.map((_,i)=>"<div class='imgt'><img id='im"+i+"'><button class='imgd' onclick='rmImg("+i+")'>X</button></div>").join("")+"</div>":"")+
    "<input type='number' id='idist' placeholder='Distancia em km' value='"+S.dist+"' oninput=\"S.dist=this.value\" step='0.1'>"+
    "<textarea id='inotas' rows='4' placeholder='Como foi o treino? Dores, canelas, sensacoes...' oninput=\"S.notas=this.value\">"+S.notas+"</textarea>"+
    "<button class='btn btn-az' onclick='analisar()' "+(podeEnv?"":"disabled style='opacity:0.4'")+">&gt;&gt; GERAR RESUMO</button>"+
    "<button class='btn btn-vd' onclick='salvarTreino()'>&gt;&gt; SALVAR TREINO</button></div>";
    setTimeout(()=>S.imgs.forEach((_,i)=>{const el=document.getElementById("im"+i);if(el)el.src=S.imgs[i];}),50);
  }
  else if(S.tab==="hist"){
    if(!S.tr.length){
      H="<div class='pg'><p class='h2'>Historico</p><div class='vazio'><p class='vt'>Nenhum treino salvo ainda</p><p class='vs'>Va em REGISTRO para adicionar!</p></div></div>";
    } else {
      const cTag={sem_dor:"tok",leve_desconforto:"twn",dor:"ter"};
      const cLab={sem_dor:"Canelas ok",leve_desconforto:"Leve desconforto",dor:"Com dor"};
      H="<div class='pg'><p class='h2'>Historico</p>"+
        S.tr.map((wo,i)=>"<div class='hcard'><div class='hrow'><div style='flex:1'><p class='htit'>Sem "+wo.w+" - Dia "+wo.d+"</p><p class='hsub'>"+wo.dt+(wo.km>0?" | "+wo.km+"km":"")+(wo.sk?" | "+SNM[wo.sk]:"")+"</p></div><span class='tag "+(cTag[wo.can]||"tok")+"'>"+(cLab[wo.can]||"ok")+"</span></div><p class='hres'>"+(wo.res||"Treino registrado.")+"</p><button class='btn btn-az' onclick='xpdf("+i+")'>EXPORTAR PDF</button></div>").join("")+"</div>";
    }
  }
  else if(S.tab==="shoes"){
    H="<div class='pg'><p class='h2'>Controle de Tenis</p>"+
      TEN.map(t=>{
        const km=Math.round(S.km[t.key]||0);const pct=Math.min(100,Math.round((km/t.max)*100));
        return "<div class='tcard "+t.cl+"'><div class='trow'><div style='flex:1'><p class='tnm'>"+t.n+"</p><p class='tmr'>"+t.m+"</p></div><p class='tkm'>"+km+" / "+t.max+" km</p></div><div class='bar'><div class='barf' style='width:"+pct+"%'></div></div><div class='bari'><span>"+pct+"% da vida util</span><span>~"+(t.max-km)+" km rest.</span></div></div>";
      }).join("")+
      "<p style='font-size:22px;color:#546e7a;text-align:center;margin-top:10px;font-weight:700'>Km acumulados ao salvar treinos</p></div>";
  }

  document.getElementById("scroll").innerHTML=H;
}
load();render();
</script>
</body>
</html>
