async function analisarTreino(){
  if(!S.ak){alert("Configure sua chave de API na aba CONFIG.");return;}
  var pl=PL[S.w-1];var isSC=SD2[S.w]===1;
  var ten=S.dia==="1"?"Boston 13":(isSC?"NB FuelCell SC Trainer V3":"Glycerin Max");
  var di=S.dia==="1"?pl.d1:pl.d2;
  var day=S.dia==="1"?(S.tv?"Quarta (Catole do Rocha)":"Terca (Joao Pessoa)"):(S.tv?"Domingo (Joao Pessoa)":"Sexta (Joao Pessoa)");
  S.load=true;S.rel=null;render();

    var cnt=[];
    S.imgs.forEach(function(img){var p=img.split(",");cnt.push({type:"image",source:{type:"base64",media_type:p[0].match(/data:(.*);/)[1],data:p[1]}});});
    cnt.push({type:"text",text:"Faca uma analise COMPLETA e DETALHADA deste treino:\n\nSemana "+S.w+" | Dia "+S.dia+" | "+new Date().toLocaleDateString("pt-BR")+"\nDia: "+day+"\nTreino prescrito: "+di.t+" - Pace alvo: "+di.p+"\nTenis: "+ten+"\nDistancia: "+(S.dist||"nao informada")+"km\nObs: "+(S.notas||"nenhuma")+"\n\nResponda SOMENTE com JSON:\n{\"resumo\":\"resumo geral 2-3 frases\",\"metricas\":[{\"n\":\"nome\",\"v\":\"valor\",\"av\":\"otimo|bom|atencao\"}],\"canelas\":\"sem_dor|leve_desconforto|dor\",\"gelo\":true,\"positivos\":[\"item\"],\"atencao\":[\"item\"],\"analise\":\"analise longa e detalhada de tudo que observou nas imagens: splits por km, FC por zona, cadencia, oscilacao vertical, assimetria, biomecânica, efeito do calor de JP, comparacao com treinos anteriores, pontos de melhora\",\"proximo\":\"orientacao detalhada para o proximo treino: qual dia, qual tenis, distancia, pace, gelo, alongamentos, o que observar\"}"});
    var resp=await fetch("https://flat-mode-3790.dimasjunho.workers.dev",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":S.ak,"anthropic-version":"2023-06-01"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:2000,system:SYS,messages:[{role:"user",content:cnt}]})});
    var data=await resp.json();
    if(data.error)throw new Error(data.error.message);
    S.rel=JSON.parse(data.content[0].text.replace(/```json|```/g,"").trim());
  }catch(err){S.rel={resumo:"Erro: "+err.message,metricas:[],canelas:"sem_dor",gelo:false,positivos:[],atencao:[],analise:"Tente novamente.",proximo:""};}
  S.load=false;render();
}

function salvarTreino(){
  var isSC=SD2[S.w]===1;var sk=S.dia==="1"?"boston13":(isSC?"scTrainer":"glycerinMax");
  var wo={w:S.w,d:S.dia,sk:sk,km:parseFloat(S.dist)||0,dt:new Date().toLocaleDateString("pt-BR"),can:S.rel?S.rel.canelas:"sem_dor",res:S.rel?S.rel.resumo:"Treino registrado.",rel:S.rel?JSON.parse(JSON.stringify(S.rel)):null};
  S.tr.unshift(wo);ss("tr",S.tr);
  var k=Object.assign({},S.km);if(sk&&wo.km>0)k[sk]=(k[sk]||0)+wo.km;S.km=k;ss("km",k);
  S.imgs=[];S.notas="";S.dist="";S.rel=null;
  bkpAuto();
  alert("Treino salvo! Backup gerado.");setTab("hist");
}

function bkpAuto(){
  try{
    var d={w:S.w,tv:S.tv,tr:S.tr,km:S.km,dt:new Date().toLocaleDateString("pt-BR")};
    var blob=new Blob([JSON.stringify(d,null,2)],{type:"application/json"});
    var url=URL.createObjectURL(blob);var a=document.createElement("a");
    a.href=url;a.download="backup_treino_"+new Date().toLocaleDateString("pt-BR").replace(/\//g,"-")+".json";
    document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  }catch(e){}
}

function bkpManual(){bkpAuto();alert("Backup salvo! Guarde no Google Drive.");}

function restaurarBackup(inp){
  var file=inp.files[0];if(!file)return;
  var r=new FileReader();
  r.onload=function(e){
    try{
      var d=JSON.parse(e.target.result);
      if(d.tr!==undefined){S.w=d.w||1;S.tv=d.tv||false;S.tr=d.tr||[];S.km=Object.assign({boston13:0,glycerinMax:0,nimbus26:0,scTrainer:0},d.km||{});ss("w",S.w);ss("tv",S.tv?"1":"0");ss("tr",S.tr);ss("km",S.km);alert("Restaurado! "+S.tr.length+" treino(s).");render();}
      else{alert("Arquivo invalido.");}
    }catch(err){alert("Erro: "+err.message);}
  };r.readAsText(file);
}

async function enviarChat(){
  var ta=document.getElementById("ci-ta");
  var txt=ta?ta.value.trim():S.cinp.trim();
  if(!txt&&!S.cimgs.length)return;
  if(!S.ak){alert("Configure sua chave de API na aba CONFIG.");return;}
  S.cload=true;
  var cnt=[];
  S.cimgs.forEach(function(img){var p=img.split(",");cnt.push({type:"image",source:{type:"base64",media_type:p[0].match(/data:(.*);/)[1],data:p[1]}});});
  if(txt)cnt.push({type:"text",text:txt});
  S.chat.push({role:"user",content:cnt,text:txt,ni:S.cimgs.length});
  S.cinp="";S.cimgs=[];ss("ch",S.chat.slice(-60));render();
  setTimeout(function(){var cm=document.getElementById("cmsg");if(cm)cm.scrollTop=cm.scrollHeight;},50);
  try{
    var msgs=S.chat.map(function(m){return {role:m.role,content:m.content||[{type:"text",text:m.text||""}]};});
    var resp=await fetch("https://flat-mode-3790.dimasjunho.workers.dev",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":S.ak,"anthropic-version":"2023-06-01"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1500,system:SYS,messages:msgs})});
    var data=await resp.json();
    if(data.error)throw new Error(data.error.message);
    var rtxt=data.content.filter(function(c){return c.type==="text";}).map(function(c){return c.text;}).join("\n");
    S.chat.push({role:"assistant",content:[{type:"text",text:rtxt}],text:rtxt});
    ss("ch",S.chat.slice(-60));
  }catch(err){S.chat.push({role:"assistant",content:[{type:"text",text:"Erro: "+err.message}],text:"Erro: "+err.message});}
  S.cload=false;render();
  setTimeout(function(){var cm=document.getElementById("cmsg");if(cm)cm.scrollTop=cm.scrollHeight;},80);
}

    H="<div class='scroll'><div class='pg'><p class='h2'>Controle de Tenis</p>"+TEN.map(function(t){var km=Math.round(S.km[t.key]||0);var pct=Math.min(100,Math.round((km/t.max)*100));return "<div class='tcard "+t.cl+"'><div class='trow'><div style='flex:1'><p class='tnm'>"+t.n+"</p><p class='tmr'>"+t.m+"</p></div><p class='tkm'>"+km+" / "+t.max+" km</p></div><div class='bar'><div class='barf' style='width:"+pct+"%'></div></div><div class='bari'><span>"+pct+"% da vida util</span><span>~"+(t.max-km)+" km rest.</span></div></div>";}).join("")+"<p style='font-size:14px;color:#546e7a;text-align:center;margin-top:8px;font-weight:700'>Km acumulados ao salvar treinos</p></div></div>";
  }

  else if(S.tab==="bkp"){
    H="<div class='scroll'><div class='pg'><p class='h2'>Backup dos Dados</p>"+
    "<div class='cav'><p style='font-size:15px;font-weight:700;color:#90caf9;line-height:1.6'>Backup automatico gerado a cada treino salvo. Guarde o arquivo no Google Drive ou WhatsApp.</p></div>"+
    "<div class='cinf'><p class='tnome'>Dados atuais</p><p class='tip'>"+S.tr.length+" treino(s) registrado(s)</p></div>"+
    "<button class='btn baz' onclick='bkpManual()'>FAZER BACKUP AGORA</button>"+
    "<div class='divl'></div>"+
    "<p style='font-size:18px;font-weight:900;color:#fff;margin-bottom:14px'>Restaurar backup</p>"+
    "<div class='cal'><p style='font-size:15px;font-weight:700;color:#ffcc80;line-height:1.6'>Atencao: restaurar substitui todos os dados atuais!</p></div>"+
    "<button class='btn bam' onclick='abrirRestaurar()'>SELECIONAR ARQUIVO DE BACKUP</button>"+
    "<input type='file' id='finp-bk' accept='.json' style='display:none' onchange='restaurarBackup(this)'></div></div>";
  }

  else if(S.tab==="cfg"){
    H="<div class='scroll'><div class='cfg'><p class='h2'>Configuracoes</p>"+
    "<div class='cbk'><p style='font-size:17px;font-weight:900;color:#fff;margin-bottom:8px'>Chave de API Anthropic</p>"+
    "<p style='font-size:14px;color:#90a4ae;margin-bottom:12px;line-height:1.6'>Necessaria para analise de treino e chat. Obtenha gratuitamente em console.anthropic.com</p>"+
    (S.ak?"<p style='font-size:15px;color:#00e676;margin-bottom:12px;font-weight:700'>Chave configurada</p>":"<p style='font-size:15px;color:#ff9800;margin-bottom:12px;font-weight:700'>Chave nao configurada</p>")+
    "<input type='password' id='inp-ak' placeholder='sk-ant-...' value='"+S.ak+"'><button class='btn bvd' onclick='salvarChave()'>SALVAR CHAVE</button></div>"+
    "<div class='cbk'><p style='font-size:17px;font-weight:900;color:#fff;margin-bottom:8px'>Historico do Chat</p><p style='font-size:14px;color:#90a4ae;margin-bottom:12px'>"+S.chat.length+" mensagem(ns) salva(s)</p><button class='btn brx' onclick='limparChat()'>LIMPAR HISTORICO DO CHAT</button></div></div></div>";
  }

  cont.innerHTML=H;
}

load();render();
</script>
</body>
</html>
